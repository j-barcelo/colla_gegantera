sonar.projectKey=colla_gegantera
sonar.projectName=Colla Gegantera
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=backend/tests,app,shared
sonar.test.inclusions=backend/tests/**/*Test.php,**/*.spec.ts,**/*.test.ts

sonar.exclusions=**/vendor/**,**/node_modules/**,public/build/**,public/app/**,backend/storage/**,backend/database/*.sqlite*,app/dist/**,app/dev-dist/**,backend/tests/**,**/*.spec.ts,**/*.test.ts,**/coverage/**,backend/bootstrap/cache/**
sonar.coverage.exclusions=backend/config/**,backend/database/**,backend/routes/**,**/*.config.*,**/*.d.ts,web/views/**,web/js/**,**/*.spec.ts,**/*.test.ts,**/*.scss,**/*.css,**/coverage/**,backend/bootstrap/cache/**

# Informes de cobertura de tests
sonar.php.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=app/coverage/lcov.info

